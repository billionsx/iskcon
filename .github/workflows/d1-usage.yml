name: d1-usage

# Замер расхода D1 и постоянная проверка предела в 10%.
#
# Cloudflare с 01.09.2026 отбивает запросы к D1 сверх суточного бесплатного
# предела (5 000 000 прочитанных строк, 100 000 записанных, обнуление 00:00 UTC).
# Цель — десятая часть: 500 000 чтений и 10 000 записей в сутки.
#
# Замер идёт ЧЕРЕЗ Actions, а не из песочницы: токен аналитики Cloudflare живёт
# здесь секретом. Результат коммитится в docs/d1-quota/ — логи Actions лежат на
# нехостящихся доменах и каналом наблюдения быть не могут.
#
# Расписание — 00:40 UTC: к этому часу предыдущие календарные сутки UTC уже
# закрыты целиком, и 48-часовое окно накрывает их полностью.
#
# Шаг «гейт» отделён от шага «замер» намеренно: замер обязан лечь в репозиторий
# ДАЖЕ когда гейт красный. Пока расход не приведён в порядок, гейт красный — это
# и есть его работа, иначе через месяц всё вернётся и никто не заметит.

on:
  workflow_dispatch:
    inputs:
      enforce:
        description: "Ронять работу при превышении 10% предела"
        type: boolean
        default: true
  schedule:
    - cron: "40 0 * * *"

permissions:
  contents: write

concurrency:
  group: d1-usage
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Замер (аналитика Cloudflare GraphQL)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d5cbe19470dc38599873eabfe148e6d1
          D1_DATABASE_ID: 6226aded-dd03-4e74-977f-9cd0b509e73d
        run: python3 tools/d1_usage.py

      - name: Замер в репозиторий
        if: always()
        run: |
          git config user.email ceo@billionsx.com
          git config user.name "Billions X"
          git add docs/d1-quota || true
          git diff --cached --quiet && echo "нечего коммитить" && exit 0
          git commit -m "d1: замер расхода $(date -u +%Y-%m-%dT%H)Z [skip ci]"
          for i in 1 2 3 4 5 6; do
            git pull --rebase -q origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "push не прошёл" && exit 1

      - name: Гейт 10% предела
        if: ${{ github.event_name == 'schedule' || inputs.enforce }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d5cbe19470dc38599873eabfe148e6d1
          D1_DATABASE_ID: 6226aded-dd03-4e74-977f-9cd0b509e73d
        run: python3 tools/d1_usage.py --enforce
