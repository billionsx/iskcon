# BILLIONS X EYES · пинг монитора после деплоя. Департамент смотрит на свежий
# прод живыми глазами и сравнивает с базовой линией прошлого снятия.
# Нужен секрет EYES_DISPATCH_TOKEN (PAT: Contents+Metadata Read на
# billionsx/eyes). Без секрета шаг не падает — монитор всё равно ходит по
# расписанию каждые 6 часов.
name: ping-eyes
on:
  workflow_run:
    workflows: ["Deploy Web (Cloudflare)"]
    types: [completed]
  workflow_dispatch:
jobs:
  ping:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Разбудить монитор департамента"
        env:
          TOKEN: ${{ secrets.EYES_DISPATCH_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "секрет EYES_DISPATCH_TOKEN не задан — монитор придёт по расписанию"
            exit 0
          fi
          curl -sS -X POST -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/billionsx/eyes/dispatches \
            -d "{\"event_type\":\"deployed\",\"client_payload\":{\"repo\":\"${{ github.repository }}\",\"sha\":\"$SHA\"}}" \
            -w "dispatch HTTP=%{http_code}\n"
