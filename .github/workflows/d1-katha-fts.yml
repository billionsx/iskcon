name: d1-katha-fts

# Перекладка таблицы поиска katha_fts на внешнее содержимое.
# Основание — tools/d1-katha-fts.sql, там же разбор и цена.
# Коротко: триггер удалял строку перебором всей таблицы поиска, и одна
# записанная строка стоила 6 908 прочитанных. 98,7% расхода базы.
#
# Работа разовая, поэтому только по кнопке. После неё проверка: план запроса
# обязан показать поиск по индексу, а живой запрос — по-прежнему находить.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d1-katha-fts

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: До правки — сколько строк стоит обновление заголовка
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d5cbe19470dc38599873eabfe148e6d1
        run: |
          DB=6226aded-dd03-4e74-977f-9cd0b509e73d
          npx -y wrangler@latest d1 execute "$DB" --remote --json --command \
            "UPDATE katha_tracks SET title = title WHERE id = (SELECT id FROM katha_tracks LIMIT 1)" \
            | tee /tmp/before.json
          echo "rows_read ДО:" $(python3 -c "import json;d=json.load(open('/tmp/before.json'));print(d[0]['meta']['rows_read'])")

      - name: Правка
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d5cbe19470dc38599873eabfe148e6d1
        run: |
          DB=6226aded-dd03-4e74-977f-9cd0b509e73d
          npx -y wrangler@latest d1 execute "$DB" --remote --file tools/d1-katha-fts.sql

      - name: После правки — то же обновление, и поиск обязан искать
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d5cbe19470dc38599873eabfe148e6d1
        run: |
          set -e
          DB=6226aded-dd03-4e74-977f-9cd0b509e73d
          npx -y wrangler@latest d1 execute "$DB" --remote --json --command \
            "UPDATE katha_tracks SET title = title WHERE id = (SELECT id FROM katha_tracks LIMIT 1)" \
            | tee /tmp/after.json
          AFTER=$(python3 -c "import json;d=json.load(open('/tmp/after.json'));print(d[0]['meta']['rows_read'])")
          BEFORE=$(python3 -c "import json;d=json.load(open('/tmp/before.json'));print(d[0]['meta']['rows_read'])")
          echo "прочитано строк на одно обновление: было $BEFORE, стало $AFTER"

          echo "── поиск обязан находить (кириллица, произвольный регистр) ──"
          npx -y wrangler@latest d1 execute "$DB" --remote --json --command \
            "SELECT COUNT(*) n FROM katha_tracks t WHERE t.rowid IN (SELECT rowid FROM katha_fts WHERE katha_fts MATCH '\"шримад\"*')" \
            | tee /tmp/find.json
          N=$(python3 -c "import json;d=json.load(open('/tmp/find.json'));print(d[0]['results'][0]['n'])")
          echo "найдено дорожек: $N"

          python3 - <<'EOF'
          import json, sys
          before = json.load(open('/tmp/before.json'))[0]['meta']['rows_read']
          after  = json.load(open('/tmp/after.json'))[0]['meta']['rows_read']
          found  = json.load(open('/tmp/find.json'))[0]['results'][0]['n']
          bad = []
          # Одна правка заголовка обязана стоить единиц строк, а не тысяч.
          if after > 50:
              bad.append(f"обновление всё ещё читает {after} строк (было {before})")
          # Поиск обязан продолжать находить — иначе мы «починили» ценой функции.
          if found <= 0:
              bad.append("поиск по кириллице перестал находить — правка отменяется")
          if bad:
              print("ПРОВЕРКА КРАСНАЯ: " + "; ".join(bad)); sys.exit(1)
          print(f"ПРОВЕРКА ЗЕЛЁНАЯ: обновление {before} → {after} строк; поиск находит {found}")
          EOF
