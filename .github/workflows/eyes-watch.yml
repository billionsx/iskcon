name: eyes-watch
# BILLIONS X EYES · НАДЗОР ПО ДВУМ ПАСПОРТАМ: ПРИЛОЖЕНИЕ И ОБОЛОЧКА ПЛЕЕРА.
# Триггер — пуш в apps/web, ежедневное расписание и ручной запуск.
#
# ⚠️ ПОЧЕМУ ЭТОТ ФАЙЛ ВЕРНУЛСЯ (16.08.2026).
#
# 10.08 департамент снял у себя все пятнадцать контуров, включая три
# reusable (review/watch/certify). Здесь тем же днём снесли ТРИ клиентских
# файла разом: `eyes.yml`, `eyes-certify.yml` и этот. Но зависимость от
# мёртвых reusable была только у первых двух — ЭТОТ контур самодостаточен:
# он сам разреженно клонирует департамент и сам зовёт `bin/eyes.py`.
# Его снесли заодно, а вместе с ним ушёл единственный надзор над main.
# Побочный ущерб: `laws-lint` покраснел в тот же час и стоял красным
# шесть суток — гейт связи `tools/eyes-link-lint.py` требовал контуры,
# которых больше нет.
#
# Закон отсюда (ЗКН-Д030, редакция 16.08): сносить вправе только то, что
# ПРАВДА зависит от снятого механизма. Массовое снятие «за компанию» —
# отдельная поломка, и гейт обязан отличать мёртвый адрес от живого.
#
# УСТРОЙСТВО. Департамент живёт в своём репозитории и сюда не переезжает:
# берётся ТОЛЬКО НА ЧТЕНИЕ, разреженным клоном (bin, adapters,
# registry/standards). Ни строки инструмента здесь нет и не появится —
# иначе судит один, а чинят другой.
#
# Храповик долга берётся оттуда же — `registry/state/ae-baseline.json`,
# одна база на всех. Копии здесь нет намеренно.
#
# ДВА ПАСПОРТА (16.08.2026). Раньше советник считал одно число на весь
# `apps/web` — и 131 находка оболочки плеера тонула в 643 находках всего
# приложения: рост долга ПЛЕЕРА был невидим. Теперь паспорта два:
#   · `iskcon`      — приложение целиком, СОВЕТНИК (У5 несут свои гейты);
#   · `iskcon-play` — оболочка `/play` + `music.css`, канон iOS 26.5.
# Рост по любому из них — красный.
on:
  push:
    branches: [main]
    paths: ["apps/web/**"]
  schedule:
    # Расписание закрывает слепое пятно: департамент вправе расширить зрение
    # или ужать базу У СЕБЯ — и проект окажется в долгу, не тронув ни строки.
    # Так и вышло 04–05.08 (AE18, база 204 → 774, грейд B → D): здесь об этом
    # не сказал никто. Правка на чужой стороне доезжает сюда максимум за сутки.
    - cron: "41 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eyes-watch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: "Департамент — на чтение, без переезда"
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse \
            https://github.com/billionsx/eyes.git __eyes
          cd __eyes
          git sparse-checkout set bin adapters registry/standards
          echo "инструмент: $(git rev-parse --short=9 HEAD) · органов $(ls bin | wc -l)"

      - name: "Храповик долга — база департамента, одна на всех"
        run: |
          curl -fsS --retry 3 \
            https://raw.githubusercontent.com/billionsx/eyes/main/registry/state/ae-baseline.json \
            -o /tmp/ae-baseline.json
          python3 - <<'PY'
          import json
          b = json.load(open('/tmp/ae-baseline.json'))
          for k in ('iskcon', 'iskcon-play'):
              d = b.get(k)
              if d is None:
                  raise SystemExit(f"в базе департамента нет паспорта {k}")
              print(f"база долга {k}: {sum(d.values())} по {len(d)} правилам")
          PY

      - name: "Надзор · приложение (советник)"
        id: lint
        run: |
          set +e
          python3 __eyes/bin/eyes.py lint --adapter iskcon --mode report \
            --project-root . --ratchet /tmp/ae-baseline.json \
            --out /tmp/eyes-report.md > /tmp/eyes-out.txt 2>&1
          RC=$?
          set -e
          grep -E "^Файлов просмотрено|ХРАПОВИК|храповик" /tmp/eyes-out.txt || true
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      # ОБОЛОЧКА ПЛЕЕРА — свой паспорт и свой храповик. Она судится каноном
      # iOS 26.5, а не законами ONE LOVE, и её долг обязан быть виден сам по
      # себе: 131 находка на 12 файлах — это её собственное число, а не доля
      # в общем котле.
      - name: "Надзор · оболочка плеера (канон iOS 26.5)"
        id: lintplay
        if: always()
        run: |
          set +e
          python3 __eyes/bin/eyes.py lint --adapter iskcon-play --mode report \
            --project-root . --ratchet /tmp/ae-baseline.json \
            --out /tmp/play-report.md > /tmp/play-out.txt 2>&1
          RC=$?
          set -e
          grep -E "^Файлов просмотрено|ХРАПОВИК|храповик" /tmp/play-out.txt || true
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: "Новые нарушения этого пуша (адресно)"
        id: newf
        if: always()
        run: |
          python3 tools/eyes-newfindings.py \
            --report /tmp/eyes-report.md \
            --before "${{ github.event.before }}" \
            --after "${{ github.sha }}" \
            --paths apps/web > /tmp/eyes-new.txt 2>&1 || true
          cat /tmp/eyes-new.txt

      # Долг советника — смесь ошибок и осознанных расхождений с корпусом
      # департамента. Пока они в одной куче, число не значит ничего. Реестр
      # раскладывает вердикт на две стопки по признаку АДРЕСА (тот же признак,
      # что несёт ЗКН-Д028 для токенов) и краснеет, только если ЭТОТ пуш
      # добавил число без адреса. Прошлое им не вменяется.
      - name: "Реестр расхождений: число без адреса — не число"
        id: divg
        if: always()
        run: |
          set +e
          python3 tools/eyes-divergence.py \
            --report /tmp/eyes-report.md \
            --before "${{ github.event.before }}" \
            --after "${{ github.sha }}" \
            --paths apps/web > /tmp/eyes-divg.txt 2>&1
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat /tmp/eyes-divg.txt

      - name: "Хроника прогона"
        if: always()
        env:
          RC: ${{ steps.lint.outputs.rc }}
          RCP: ${{ steps.lintplay.outputs.rc }}
        run: |
          {
            echo "## BXE · надзор по двум паспортам"
            echo
            if [ "${RC:-1}" = "0" ]; then
              echo "- приложение: долг не вырос"
            else
              echo "- приложение: **ДОЛГ ВЫРОС**"
            fi
            if [ "${RCP:-1}" = "0" ]; then
              echo "- оболочка плеера: долг не вырос"
            else
              echo "- оболочка плеера: **ДОЛГ ВЫРОС**"
            fi
            echo
            grep -E "^Файлов просмотрено" /tmp/play-report.md 2>/dev/null || true
            echo
            grep -E "ХРАПОВИК" /tmp/eyes-out.txt /tmp/play-out.txt 2>/dev/null || true
            echo
            cat /tmp/eyes-new.txt 2>/dev/null || true
            echo
            cat /tmp/eyes-divg.txt 2>/dev/null || true
            echo
            echo "Область надзора — глобы паспортов \`adapters/iskcon.json\` и"
            echo "\`adapters/iskcon-play.json\` в репозитории департамента. Строки вне"
            echo "её не смотрели и чистыми не объявляем."
            echo
            echo "<details><summary>Отчёт по оболочке плеера</summary>"
            echo
            head -c 300000 /tmp/play-report.md 2>/dev/null || echo "(отчёт не собран)"
            echo
            echo "</details>"
            echo
            echo "<details><summary>Полный отчёт советника по приложению</summary>"
            echo
            head -c 700000 /tmp/eyes-report.md 2>/dev/null || echo "(отчёт не собран)"
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Вердикт"
        run: |
          BAD=0
          if [ "${{ steps.lint.outputs.rc }}" != "0" ]; then
            echo "долг приложения вырос — смотри хронику прогона"
            BAD=1
          fi
          if [ "${{ steps.lintplay.outputs.rc }}" != "0" ]; then
            echo "долг ОБОЛОЧКИ ПЛЕЕРА вырос — смотри хронику прогона"
            BAD=1
          fi
          if [ "${{ steps.divg.outputs.rc }}" != "0" ]; then
            echo "этот пуш добавил число без адреса — смотри реестр расхождений"
            BAD=1
          fi
          [ "$BAD" = "0" ] && echo "долг не вырос ни по одному паспорту"
          exit "$BAD"
