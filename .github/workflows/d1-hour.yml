name: d1-hour

# Разбор ОДНОГО часа расхода.
#
# 01.09.2026 в 18:00 UTC база прочитала 42 915 209 строк при 126 запросах —
# в семь раз больше, чем за все предыдущие сутки вместе, и приложение
# упёрлось в суточный предел: библиотека перестала отдавать оглавление.
# Суточный отчёт виновника не назвал: 78 % расхода не попало в топ-25,
# потому что размазалось по запросам с разным текстом. Нужен именно час.

on:
  workflow_dispatch:
    inputs:
      hour:
        description: "Час UTC в виде 2026-09-01T18 (пусто, если задан writes)"
        default: ""
      writes:
        description: "Сутки UTC для разбора ЗАПИСЕЙ, вид 2026-09-01"
        default: ""

permissions:
  contents: read

jobs:
  hour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Кто съел час"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d5cbe19470dc38599873eabfe148e6d1
          D1_DATABASE_ID: 6226aded-dd03-4e74-977f-9cd0b509e73d
        run: |
          if [ -n "${{ inputs.writes }}" ]; then
            python3 tools/d1_usage.py --writes "${{ inputs.writes }}" 2>&1 | tee hour.log
          else
            python3 tools/d1_usage.py --hour "${{ inputs.hour }}" 2>&1 | tee hour.log
          fi
          while IFS= read -r l; do echo "::notice::$l"; done < hour.log
