name: bxad-brief
on:
  schedule:
    - cron: "31 8 * * 1"   # бриф — понедельник (ст. 56 · M6)
  workflow_dispatch:
concurrency:
  group: bxad-brief
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Big7-бриф недели (ст. 56 · M6)"
        run: python3 bxad/bin/brief.py
      - name: "Эфир"
        run: python3 bxad/bin/dashboard.py
      - name: "Хроника брифа"
        run: |
          git config user.name "bxad"; git config user.email "ceo@billionsx.com"
          git add bxad/briefs bxad/registry bxad/dashboard
          git commit -m "bxad: big7-бриф недели" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -X theirs -q && git push -q && break || sleep 4; done
