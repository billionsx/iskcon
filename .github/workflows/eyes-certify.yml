# BILLIONS X EYES · СЕРТИФИКАТ МЕСЯЦА (файл кладётся В РЕПОЗИТОРИЙ ПРОЕКТА
# как .github/workflows/eyes-certify.yml). Считает прогон самого проекта,
# на встроенном ключе репозитория: департаменту не выдаётся НИЧЕГО.
# Документ ложится в .eyes/ вашего же репозитория — помесячно, с реестром
# и отпечатками sha256 против подмены.
#
# Годится и приватному репозиторию: департамент публичен и забирается без
# ключа, а ваш код никуда не уезжает.
name: eyes-certify
on:
  schedule:
    - cron: "23 7 1 * *"                        # первое число месяца
  workflow_dispatch:
# ПРАВА. Без этого блока прогон умирает ДО первого шага: с 2023 года
# GitHub по умолчанию выдаёт токену только чтение, а вызываемый контур
# просит больше — превышение гасит запуск целиком (startup_failure),
# и надзор молчит так, будто код чист. Права вызывающего обязаны
# покрывать права вызываемого.
permissions:
  contents: write
jobs:
  certify:
    uses: billionsx/eyes/.github/workflows/eyes-certify-reusable.yml@main
    with:
      project: iskcon
      globs: "apps/web/src/**/*.css,apps/web/src/**/*.tsx"
