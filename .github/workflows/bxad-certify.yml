name: bxad-certify
on:
  schedule:
    - cron: "23 7 1 * *"   # сертификат — первое число месяца (ст. 56 · M3)
  workflow_dispatch:
concurrency:
  group: bxad-certify
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Инструменты"
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium > /dev/null 2>&1
      - name: "Сертификация — скор, HTML+PDF, бейдж (ст. 56 · M3)"
        env: { PROJECT_ROOT: "." }
        run: python3 bxad/bin/certify.py --pdf
      - name: "Эфир"
        run: python3 bxad/bin/dashboard.py
      - name: "Хроника сертификата"
        run: |
          git config user.name "bxad"; git config user.email "ceo@billionsx.com"
          git add bxad/certificates bxad/registry bxad/dashboard
          git commit -m "bxad: сертификат месяца" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -X theirs -q && git push -q && break || sleep 4; done
