name: bxad-review-reusable
on:
  workflow_call:
    inputs:
      globs:
        description: "CSV-глобы файлов клиента (например src/**/*.css,src/**/*.tsx)"
        required: true
        type: string
      project:
        description: "Имя проекта клиента"
        required: false
        type: string
        default: "client"
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          repository: billionsx/iskcon
          path: __bxad
          sparse-checkout: bxad
      - name: "BXAD · ревью PR клиента по измеренным законам"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT_ROOT: .
          BXAD_CLIENT_GLOBS: ${{ inputs.globs }}
          BXAD_CLIENT_PROJECT: ${{ inputs.project }}
        run: python3 __bxad/bxad/bin/review.py
