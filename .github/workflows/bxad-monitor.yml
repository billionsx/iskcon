name: bxad-monitor
on:
  workflow_run:
    workflows: ["deploy-web"]
    types: [completed]
  workflow_dispatch:
concurrency:
  group: bxad-monitor
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  watch:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Инструменты"
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium > /dev/null 2>&1
      - name: "Монитор прода — живой взгляд после деплоя (ст. 56 · M2)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 bxad/bin/monitor.py
      - name: "Эфир"
        run: python3 bxad/bin/dashboard.py
      - name: "Хроника монитора"
        run: |
          git config user.name "bxad"; git config user.email "ceo@billionsx.com"
          git add bxad/registry bxad/dashboard
          git commit -m "bxad: монитор прода" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break || sleep 4; done
