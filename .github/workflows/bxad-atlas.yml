name: bxad-atlas
on:
  schedule:
    - cron: "7 17 * * *"   # урожай №1 (устав ст. 49)
    - cron: "37 2 * * *"   # урожай №2
  workflow_dispatch:
concurrency:
  group: bxad-atlas        # своя группа: пуши репозитория урожай не трогают
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Инструменты"
        run: |
          pip install --quiet pillow numpy fonttools playwright
          python3 -m playwright install --with-deps chromium > /dev/null 2>&1
          command -v 7z >/dev/null || sudo apt-get -yq install p7zip-full >/dev/null
      - name: "Суд — короткий (гейт урожая)"
        run: python3 bxad/bin/bxad.py selftest > /dev/null
      - name: "Атлас — шаг по всей документации (ст. 37.1)"
        run: python3 bxad/bin/bxad.py atlas --budget 1500
      - name: "Веб-атлас — кит лендингов Apple (ст. 36.3)"
        run: python3 bxad/bin/bxad.py weblab || true
      - name: "Большая семёрка — познание бизнес-логики (ст. 55)"
        timeout-minutes: 12
        continue-on-error: true
        run: |
          python3 bxad/bin/bxad.py consult > bxad/registry/bizlab/last-run.log 2>&1 || echo "ШАГ УПАЛ RC=$?" >> bxad/registry/bizlab/last-run.log
          tail -4 bxad/registry/bizlab/last-run.log

      - name: "Кит — величины официальных китов (ст. 36.1)"
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_KIT_KEY: ${{ secrets.FIGMA_KIT_KEY }}
        run: python3 bxad/bin/bxad.py kit || true
      - name: "Живой взгляд — DOM и computed-styles приложения (ст. 37.3)"
        timeout-minutes: 10
        continue-on-error: true
        run: |
          python3 bxad/bin/liveview.py --live || echo "живой взгляд: см. registry/live"
      - name: "Эфир — пересборка дашборда (ст. 54)"
        if: always()
        run: python3 bxad/bin/dashboard.py

      - name: "Хроника урожая — коммит"
        if: always()
        run: |
          git config user.name "bxad"; git config user.email "ceo@billionsx.com"
          git add bxad/registry bxad/dashboard
          git commit -m "bxad: урожай (атлас · веб-атлас · кит · живой взгляд)" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break || sleep 4; done
